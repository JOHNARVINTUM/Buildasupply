<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}BUILTASUPPLY{% endblock %}</title><style>
:root{--navy:#102a43;--green:#216869;--paper:#f6f4ef;--surface:#fff;--ink:#18212b;--muted:#617182;--line:#ced6de;--danger:#a12b2b;--space:1rem}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}.shell{max-width:1100px;margin:auto;padding:24px}.brand{font-weight:800;letter-spacing:.08em;color:var(--navy);text-decoration:none}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px}.panel{max-width:560px;background:var(--surface);border:1px solid var(--line);margin:48px auto;padding:32px}.status{background:var(--navy);color:#fff;margin:-32px -32px 26px;padding:13px 32px;font-size:.85rem;font-weight:700;letter-spacing:.04em}label{display:block;font-weight:650;margin-top:16px}input{width:100%;padding:11px;border:1px solid var(--line);border-radius:3px;font:inherit}button,.button{display:inline-block;background:var(--green);color:#fff;border:0;border-radius:3px;padding:11px 16px;font:inherit;font-weight:700;text-decoration:none;margin-top:22px;cursor:pointer}.secondary{background:transparent;color:var(--navy);border:1px solid var(--navy)}.muted{color:var(--muted)}.errorlist{color:var(--danger);padding-left:18px}.notice{border-left:4px solid var(--green);padding:10px;background:#e8f2ef}@media(max-width:560px){.shell{padding:16px}.panel{margin:24px 0;padding:22px}.status{margin:-22px -22px 22px;padding:12px 22px}}</style></head><body><main class="shell"><header class="top"><a class="brand" href="/">BUILTASUPPLY</a>{% if user.is_authenticated %}<a href="{% url 'accounts:logout' %}">Sign out</a>{% endif %}</header>{% for message in messages %}<p class="notice">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main></body></html>
