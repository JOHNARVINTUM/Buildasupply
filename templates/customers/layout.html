{% extends 'base.html' %}
{% block content %}
<style>
/* Customer pages only. Reuse the shared base without changing teammates' layouts. */
.shell:has(.customer-workspace){max-width:1240px;padding:28px 36px 48px}
.shell:has(.customer-workspace) .top{gap:24px;padding-bottom:24px;flex-wrap:wrap}
.shell:has(.customer-workspace) .top nav{flex-wrap:wrap;gap:10px 22px}
.shell:has(.customer-workspace) .top nav a{color:var(--navy);font-size:.86rem;text-decoration:none}
.shell:has(.customer-workspace) .top nav a:hover{text-decoration:underline}
.shell:has(.customer-workspace) .notice{border-radius:6px;overflow-wrap:anywhere}
.customer-workspace{--line:#dce2e4;--muted:#526677;padding-top:24px;overflow-wrap:anywhere}
.customer-workspace a{color:var(--green);text-underline-offset:4px}
.customer-workspace :is(a,button,input,select,summary):focus-visible{outline:3px solid #b06b1e;outline-offset:4px}
.customer-workspace .trail{display:flex;gap:10px;align-items:center;margin:0 0 24px;font-size:.82rem;color:var(--muted)}
.customer-workspace .trail a{text-decoration:none}
.customer-workspace h1{font-size:clamp(1.8rem,4vw,2.65rem);line-height:1.12;letter-spacing:-.045em;color:var(--navy);margin:12px 0 18px}
.customer-workspace h2{font-size:1.2rem;line-height:1.3;color:var(--navy);letter-spacing:-.02em}
.customer-workspace p{line-height:1.65}
.customer-workspace .panel{max-width:100%;margin:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:32px;box-shadow:0 6px 24px #102a4305;overflow:hidden}
.customer-workspace .panel.narrow{max-width:720px;margin-inline:auto}
.customer-workspace .status{background:transparent;color:var(--green);margin:0 0 16px;padding:0;font-size:.7rem;letter-spacing:.12em}
.customer-workspace .button,.customer-workspace button{border-radius:6px;min-height:44px;line-height:1.4;padding:12px 18px;margin-top:12px;color:white;text-align:center;max-width:100%}
.customer-workspace .secondary{background:#fff;color:var(--navy);border:1px solid #b9c7ce}
.customer-workspace :is(.button,button):hover{filter:brightness(.94)}
.customer-workspace [aria-disabled=true]{opacity:.65;cursor:default}
.customer-workspace input:not([type=radio]):not([type=checkbox]):not([type=hidden]),.customer-workspace select,.customer-workspace textarea{width:100%;min-height:46px;border:1px solid #aebdc5;border-radius:6px;background:#fff;padding:11px 12px;font:inherit;color:var(--ink)}
.customer-workspace input:is([type=radio],[type=checkbox]){width:auto;accent-color:var(--green);min-width:18px;min-height:18px}
.customer-workspace label{font-size:.9rem}
.customer-workspace .errorlist{background:#fff1ef;border-radius:6px;padding:12px 12px 12px 30px;font-size:.9rem}
.customer-workspace .hero{display:grid;grid-template-columns:1.5fr 1fr;gap:28px;background:var(--navy);color:#fff;border-radius:12px;padding:40px;margin-bottom:32px}
.customer-workspace .hero h1{color:#fff;font-size:clamp(2.3rem,5vw,3.5rem);max-width:620px;margin:14px 0}
.customer-workspace .eyebrow{font-size:.7rem;font-weight:750;letter-spacing:.16em;text-transform:uppercase}
.customer-workspace .hero p{color:#d6e1e9;max-width:530px;margin-bottom:0}
.customer-workspace .hero-note{border-left:1px solid #ffffff40;padding-left:28px;align-self:center}
.customer-workspace .hero-note strong{display:block;font-size:1.05rem;margin-bottom:8px}
.customer-workspace .hero-note p{font-size:.9rem;margin:0 0 20px}
.customer-workspace .section-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.customer-workspace .section-heading h2{margin:0;font-size:1.5rem}
.customer-workspace .section-heading p{margin:6px 0 0}
.customer-workspace .product-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.customer-workspace .product-card{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.customer-workspace .product-art{background:#edf1ee;aspect-ratio:1.5;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#617566;font-size:.8rem;letter-spacing:.04em}
.customer-workspace .product-art img{width:100%;height:100%;object-fit:contain}
.customer-workspace .product-copy{padding:22px;display:flex;flex-direction:column;flex:1;align-items:start}
.customer-workspace .product-copy h2{margin:12px 0 8px}
.customer-workspace .product-copy p{margin:4px 0 12px;font-size:.9rem}
.customer-workspace .price{font-size:1.4rem;color:var(--navy);font-weight:750;letter-spacing:-.03em}
.customer-workspace .product-copy .button{margin-top:auto;width:100%}
.customer-workspace .badge{display:inline-block;border-radius:4px;background:#e8f2ef;color:#185d51;padding:5px 9px;font-size:.68rem;font-weight:750;letter-spacing:.04em;text-transform:uppercase}
.customer-workspace .badge.warning{background:#fff1da;color:#77500c}
.customer-workspace .empty-state{text-align:center;padding:48px 24px;background:#fff;border:1px dashed #bbc9cc;border-radius:10px;grid-column:1/-1}
.customer-workspace .empty-state h2{font-size:1.4rem;margin:8px 0}
.customer-workspace .empty-state p{max-width:440px;margin:12px auto;color:var(--muted)}
.customer-workspace .two-column{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,.48fr);gap:24px;align-items:start}
.customer-workspace .product-detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:36px}
.customer-workspace .product-detail .product-art{aspect-ratio:1;min-height:220px;border-radius:8px}
.customer-workspace .product-detail input[type=number]{max-width:160px}
.customer-workspace .card{border:1px solid var(--line);border-radius:8px;padding:22px;background:#fff;margin-bottom:18px;min-width:0}
.customer-workspace .card h2{margin:0 0 16px}
.customer-workspace .summary{background:#f0f4f2;border:1px solid #d8e1dc;border-radius:8px;padding:24px}
.customer-workspace .summary h2{margin-top:0}
.customer-workspace .summary .button{display:block}
.customer-workspace .money-row{display:flex;justify-content:space-between;gap:20px;margin:12px 0}
.customer-workspace .money-row.total{border-top:1px solid #bfcfca;padding-top:18px;font-size:1.12rem}
.customer-workspace .cart-line{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:18px;padding:22px 0;border-top:1px solid var(--line)}
.customer-workspace .cart-line img{width:70px;height:70px;object-fit:contain;background:#f0f4f2;border-radius:6px}
.customer-workspace .quantity-edit{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.customer-workspace .quantity-edit input{max-width:100px}
.customer-workspace .quantity-edit button{margin:0}
.customer-workspace .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.customer-workspace .address-choice{border:1px solid var(--line);padding:18px;border-radius:8px;display:flex;align-items:start;gap:12px;font-weight:400}
.customer-workspace .address-choice:has(input:checked){border-color:var(--green);background:#f0f7f4}
.customer-workspace .address-choice input{margin-top:4px;flex-shrink:0}
.customer-workspace .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
.customer-workspace .form-grid .wide{grid-column:1/-1}
.customer-workspace .address-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.customer-workspace .address-grid .card{margin:0}
.customer-workspace .order-card{border:1px solid var(--line);border-radius:8px;margin:18px 0;padding:24px}
.customer-workspace .order-card .section-heading{margin-bottom:12px}
.customer-workspace .order-card h2{margin:0}
.customer-workspace details{border:1px solid var(--line);padding:18px;border-radius:8px}
.customer-workspace summary{cursor:pointer;font-weight:650;color:var(--navy)}
.customer-workspace .footnote{margin-top:32px;border-top:1px solid var(--line);padding-top:20px;display:flex;justify-content:space-between;gap:16px;font-size:.78rem;color:var(--muted)}
.customer-workspace .sr-only{position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden}
@media(min-width:1000px){.customer-workspace .summary{position:sticky;top:24px}}
@media(max-width:850px){.customer-workspace .product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.customer-workspace .two-column{grid-template-columns:1fr}.customer-workspace .hero{padding:28px;grid-template-columns:1fr}.customer-workspace .hero-note{border-left:0;border-top:1px solid #ffffff40;padding:20px 0 0;display:flex;gap:24px}.customer-workspace .hero-note p{margin:0}}
@media(max-width:600px){.shell:has(.customer-workspace){padding:20px 16px 32px}.shell:has(.customer-workspace) .top{gap:14px}.shell:has(.customer-workspace) .top nav{gap:12px 16px}.customer-workspace .panel{padding:22px}.customer-workspace .product-grid,.customer-workspace .product-detail,.customer-workspace .address-grid,.customer-workspace .form-grid{grid-template-columns:1fr}.customer-workspace .hero{padding:24px}.customer-workspace .hero-note{display:block}.customer-workspace .hero-note p{margin-bottom:14px}.customer-workspace .product-art{aspect-ratio:1.8}.customer-workspace .cart-line{grid-template-columns:48px minmax(0,1fr)}.customer-workspace .cart-line img{width:48px;height:48px}.customer-workspace .cart-line>.line-total{grid-column:2}.customer-workspace .footnote{flex-direction:column;gap:8px}.customer-workspace .card,.customer-workspace .order-card{padding:18px}.customer-workspace .actions>*{flex-grow:1}.customer-workspace .actions form button{width:100%}}
</style>
<div class="customer-workspace">
  <nav class="trail" aria-label="Breadcrumb"><a href="{% url 'shop-browse' %}">Marketplace</a><span aria-hidden="true">/</span><span>{% block customer_location %}Customer{% endblock %}</span></nav>
  {% block customer_content %}{% endblock %}
  <footer class="footnote"><span>BUILTASUPPLY · Supplies for your next build.</span><span>Prices in Philippine pesos (PHP).</span></footer>
</div>
{% endblock %}
