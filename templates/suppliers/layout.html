{% extends 'base.html' %}
{% block content %}
<style>
/* Blueprint design is scoped to supplier pages. Shared base and role pages stay owned by their teams. */
body:has(.supplier-workspace){background-color:#eef4f9;isolation:isolate;color:#20384d}
.shell:has(.supplier-workspace){max-width:1320px;padding:28px 40px 40px;--navy:#163e62;--green:#194f78;--paper:#f4f7f9;--line:#c6d6e1;--muted:#536c7f;--ink:#20384d;--danger:#9c3535}

.shell:has(.supplier-workspace) .notice{border:1px solid #b6cbd8;border-left:3px solid #194f78;background:#eaf2f7;color:#20384d;padding:16px 18px;font-size:.9rem;overflow-wrap:anywhere}
.supplier-workspace{--line:#c6d6e1;--muted:#536c7f;padding-top:20px;overflow-wrap:anywhere}
.supplier-workspace a{color:var(--green);text-underline-offset:4px}
.supplier-workspace :is(a,button,input,select,summary):focus-visible{outline:3px solid #b57628;outline-offset:4px}
.supplier-workspace .trail{display:flex;gap:12px;align-items:center;margin:0 0 28px;font:11px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.supplier-workspace .trail a{text-decoration:none}
.supplier-workspace h1{font-size:clamp(1.9rem,4vw,2.9rem);font-weight:650;line-height:1.1;letter-spacing:-.045em;color:var(--navy);margin:12px 0 16px}
.supplier-workspace h2{font-size:1.12rem;line-height:1.3;color:var(--navy);letter-spacing:-.02em;font-weight:650}
.supplier-workspace p{line-height:1.65}
.supplier-workspace .panel{max-width:100%;margin:0;background:#ffffffeb;border:1px solid var(--line);border-radius:0;padding:32px;box-shadow:none;overflow:hidden}
.supplier-workspace .panel.narrow{max-width:740px;margin-inline:auto}
.supplier-workspace .status,.supplier-workspace .eyebrow{background:transparent;color:var(--green);margin:0 0 16px;padding:0;font:600 10px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase}
.supplier-workspace .eyebrow{display:inline-block;margin:0}
.supplier-workspace .button,.supplier-workspace button{border:1px solid var(--navy);border-radius:0;background:var(--navy);min-height:44px;line-height:1.4;padding:12px 18px;margin-top:12px;color:#fff;text-align:center;max-width:100%;font-size:.85rem;font-weight:600;transition:background .15s,color .15s}
.supplier-workspace .secondary{background:transparent;color:var(--navy);border:1px solid #9db4c4}
.supplier-workspace :is(.button,button):hover{background:#245d86;color:#fff;border-color:#245d86}
.supplier-workspace [aria-disabled=true]{opacity:.65;cursor:default}
.supplier-workspace input:not([type=radio]):not([type=checkbox]):not([type=hidden]),.supplier-workspace select,.supplier-workspace textarea{width:100%;min-height:46px;border:1px solid #9db4c4;border-radius:0;background:#fbfdff;padding:11px 12px;font:inherit;color:var(--ink)}
.supplier-workspace input:is([type=radio],[type=checkbox]){width:auto;accent-color:var(--green);min-width:18px;min-height:18px}
.supplier-workspace label{font-size:.8rem;font-weight:600;margin-top:18px}
.supplier-workspace .errorlist{background:#fff2ee;border:1px solid #dfbdb4;padding:12px 12px 12px 30px;font-size:.85rem;color:#8f302b}
.supplier-workspace .hero{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;border:1px solid #91adc1;border-top:3px solid var(--navy);padding:40px 40px 0;margin-bottom:26px;background:#f7fbfdd9;position:relative}
.supplier-workspace .hero::before{content:'+';position:absolute;left:-6px;top:-15px;color:var(--navy);font:20px monospace}
.supplier-workspace .hero h1{font-size:clamp(2.6rem,5.2vw,4.4rem);font-weight:600;max-width:620px;margin:24px 0;letter-spacing:-.055em}
.supplier-workspace .hero h1 span{font-weight:350;color:#54768f}
.supplier-workspace .hero p{color:var(--muted);max-width:390px;margin-bottom:24px;font-size:.92rem}
.supplier-workspace .hero .eyebrow{border:1px solid #adc1d0;padding:5px 9px;font-size:9px}
.supplier-workspace .hero .button{margin:0 0 32px}
.supplier-workspace .plan{min-width:0;align-self:center;position:relative}
.supplier-workspace .plan svg{display:block;width:100%;height:auto;max-height:350px}
.supplier-workspace .plan-caption{display:flex;justify-content:space-between;gap:12px;font:9px/1.5 ui-monospace,Consolas,monospace;letter-spacing:.09em;color:#536c7f;border-top:1px solid #b9cedd;padding:12px 0 24px;text-transform:uppercase}
.supplier-workspace .hero-strip{grid-column:1/-1;border-top:1px solid #adc1d0;display:grid;grid-template-columns:repeat(3,1fr);margin:0 -40px;background:#edf4f8}
.supplier-workspace .hero-strip div{padding:16px 24px;font:10px/1.5 ui-monospace,Consolas,monospace;letter-spacing:.02em;color:#536c7f;border-right:1px solid #adc1d0;display:flex;gap:12px;align-items:center}
.supplier-workspace .hero-strip div:last-child{border-right:0}
.supplier-workspace .hero-strip b{font-size:10px;color:#163e62;font-weight:600}
.supplier-workspace .section-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin:0 0 26px}
.supplier-workspace .section-heading h2{margin:8px 0;font-size:1.5rem}
.supplier-workspace .section-heading p{margin:6px 0 0;font-size:.9rem}
.supplier-workspace .section-heading>a{font-size:.85rem}
.supplier-workspace .product-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.supplier-workspace .product-card{background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;transition:border-color .15s,box-shadow .15s}
.supplier-workspace .product-card:hover{border-color:#6389a5;box-shadow:4px 4px 0 #dce7ee}
.supplier-workspace .product-art{background-color:#edf3f7;background-image:linear-gradient(#214f790c 1px,transparent 1px),linear-gradient(90deg,#214f790c 1px,transparent 1px);background-size:20px 20px;aspect-ratio:1.4;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;color:#6c879b;font:10px/1.5 ui-monospace,Consolas,monospace;letter-spacing:.04em;position:relative;border-bottom:1px solid var(--line)}
.supplier-workspace .product-art::before,.supplier-workspace .product-art::after{content:'+';position:absolute;font:18px monospace;color:#9fb9cc;top:10px;left:12px}
.supplier-workspace .product-art::after{inset:auto 12px 10px auto}
.supplier-workspace .product-art>img{width:100%;height:100%;object-fit:contain;min-height:0;padding:20px}
.supplier-workspace .supply-mark{width:72px;height:72px;color:#7a9ab2;margin:12px}
.supplier-workspace .product-copy{padding:22px;display:flex;flex-direction:column;flex:1;align-items:start}
.supplier-workspace .product-copy h2{margin:14px 0 6px;font-size:1.2rem}
.supplier-workspace .product-copy p{margin:4px 0 14px;font-size:.82rem}
.supplier-workspace .price{font-size:1.5rem;color:var(--navy);font-weight:650;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.supplier-workspace .product-copy .button{margin-top:auto;width:100%}
.supplier-workspace .badge{display:inline-block;border:1px solid #b5c9d8;background:#eef5f9;color:#194f78;padding:5px 8px;font:600 9px/1.5 ui-monospace,Consolas,monospace;letter-spacing:.03em;text-transform:uppercase;max-width:100%}
.supplier-workspace .badge.warning{background:#fff5e6;color:#7d560d;border-color:#dfc58f}
.supplier-workspace .empty-state{text-align:center;padding:48px 24px;background:#fafdffee;border:1px dashed #a0b9cd;grid-column:1/-1;position:relative}
.supplier-workspace .empty-state::before{content:'+';position:absolute;top:-12px;left:-6px;font:20px monospace;color:var(--navy)}
.supplier-workspace .empty-state h2{font-size:1.35rem;margin:8px 0}
.supplier-workspace .empty-state p{max-width:440px;margin:12px auto;color:var(--muted);font-size:.9rem}
.supplier-workspace .two-column{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,.47fr);gap:24px;align-items:start}
.supplier-workspace .product-detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px}
.supplier-workspace .product-detail .product-art{aspect-ratio:1;min-height:240px;border:1px solid var(--line)}
.supplier-workspace .product-detail .supply-mark{width:120px;height:120px}
.supplier-workspace .product-detail input[type=number]{max-width:140px}
.supplier-workspace .product-specs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);margin:24px 0}
.supplier-workspace .product-specs div{padding:16px;border-right:1px solid var(--line)}
.supplier-workspace .product-specs div:last-child{border:0}
.supplier-workspace .product-specs dt,.supplier-workspace .facts dt{font:10px/1.6 ui-monospace,Consolas,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.supplier-workspace .product-specs dd,.supplier-workspace .facts dd{margin:0;color:var(--navy);font-size:.92rem}
.supplier-workspace .card{border:1px solid var(--line);padding:24px;background:#ffffffed;margin-bottom:22px;min-width:0}
.supplier-workspace .card h2{margin:6px 0 18px}
.supplier-workspace .summary{background:#eaf2f7;border:1px solid #9bb6ca;border-top:3px solid var(--navy);padding:24px}
.supplier-workspace .summary h2{margin-top:0}
.supplier-workspace .summary p{font-size:.88rem}
.supplier-workspace .summary .button{display:block}
.supplier-workspace .money-row{display:flex;justify-content:space-between;gap:20px;margin:14px 0;font-size:.9rem}
.supplier-workspace .money-row strong{font-variant-numeric:tabular-nums}
.supplier-workspace .money-row.total{border-top:1px solid #adc3d3;padding-top:18px;font-size:1.1rem}
.supplier-workspace .cart-line{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:18px;padding:24px 0;border-top:1px solid var(--line)}
.supplier-workspace .cart-line img{width:60px;height:60px;object-fit:contain;background:#f0f4f7}
.supplier-workspace .quantity-edit{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.supplier-workspace .quantity-edit input{max-width:100px}
.supplier-workspace .quantity-edit button{margin:0}
.supplier-workspace .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.supplier-workspace .address-choice{border:1px solid var(--line);padding:18px;display:flex;align-items:start;gap:12px;font-weight:400;background:#fff}
.supplier-workspace .address-choice:has(input:checked){border-color:var(--green);background:#eef5f9;box-shadow:inset 3px 0 #194f78}
.supplier-workspace .address-choice input{margin-top:4px;flex-shrink:0}
.supplier-workspace .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
.supplier-workspace .form-grid .wide{grid-column:1/-1}
.supplier-workspace .address-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.supplier-workspace .address-grid .card{margin:0;border-top:3px solid #93b0c4}
.supplier-workspace .order-card{border:1px solid var(--line);margin:18px 0;padding:24px;background:#fff}
.supplier-workspace .order-card .section-heading{margin-bottom:12px}
.supplier-workspace .order-card h2{margin:0}
.supplier-workspace .facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-block:1px solid var(--line);margin:24px 0}
.supplier-workspace .facts>div{padding:18px;border-right:1px solid var(--line)}
.supplier-workspace .facts>div:last-child{border:0}
.supplier-workspace .delivery-address{font-style:normal;line-height:1.8;font-size:.9rem;color:var(--muted)}
.supplier-workspace .order-line{display:flex;justify-content:space-between;gap:20px;padding:16px 0;border-top:1px solid var(--line);font-size:.9rem}
.supplier-workspace .receipt-mark{display:grid;place-items:center;width:48px;height:48px;border:1px solid #8fadc2;color:var(--navy);margin-bottom:20px;font-size:24px;background:#edf5fa}
.supplier-workspace .step-label{display:flex;align-items:center;gap:10px;font:10px/1.5 ui-monospace,Consolas,monospace;color:var(--muted);margin:0 0 24px;flex-wrap:wrap;text-transform:uppercase}
.supplier-workspace .step-label span{padding:6px 10px;border:1px solid #b9cedd;background:#f6fafd}
.supplier-workspace .step-label .current{background:var(--navy);color:white;border-color:var(--navy)}
.supplier-workspace details{border:1px solid var(--line);padding:18px;background:#fff}
.supplier-workspace summary{cursor:pointer;font-weight:600;color:var(--navy);font-size:.85rem}
.supplier-workspace .footnote{margin-top:40px;border-top:2px solid var(--navy);padding-top:18px;display:flex;justify-content:space-between;gap:16px;font:10px/1.6 ui-monospace,Consolas,monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.supplier-workspace .sr-only{position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden}
@media(prefers-reduced-motion:reduce){.supplier-workspace *{transition:none!important;scroll-behavior:auto!important}}
@media(min-width:1000px){.supplier-workspace .summary{position:sticky;top:24px}}
@media(max-width:950px){.supplier-workspace .two-column{grid-template-columns:1fr}.supplier-workspace .hero{padding:28px 28px 0;gap:16px}.supplier-workspace .hero-strip{margin:0 -28px}.supplier-workspace .hero h1{font-size:3rem}.supplier-workspace .product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.supplier-workspace .hero-strip div{padding:14px}}
@media(max-width:700px){.supplier-workspace .hero{grid-template-columns:1fr}.supplier-workspace .plan{max-width:480px;justify-self:center;width:100%}.supplier-workspace .hero .button{margin-bottom:0}.supplier-workspace .hero p{max-width:none}.supplier-workspace .hero-strip{grid-template-columns:1fr}.supplier-workspace .hero-strip div{border-right:0;border-bottom:1px solid #b9cedd;padding:12px 24px}.supplier-workspace .hero-strip div:last-child{border-bottom:0}.supplier-workspace .product-detail{grid-template-columns:1fr;gap:28px}.supplier-workspace .facts{grid-template-columns:1fr}.supplier-workspace .facts>div{border-right:0;border-bottom:1px solid var(--line)}.supplier-workspace .facts>div:last-child{border:0}}
@media(max-width:600px){.shell:has(.supplier-workspace){padding:20px 16px 32px}.supplier-workspace .panel{padding:22px}.supplier-workspace .product-grid,.supplier-workspace .address-grid,.supplier-workspace .form-grid{grid-template-columns:1fr}.supplier-workspace .hero{padding:24px 24px 0}.supplier-workspace .hero-strip{margin:0 -24px}.supplier-workspace .hero h1{font-size:2.9rem;margin:20px 0}.supplier-workspace .hero .eyebrow{font-size:8px}.supplier-workspace .product-art{aspect-ratio:1.6}.supplier-workspace .cart-line{grid-template-columns:40px minmax(0,1fr)}.supplier-workspace .cart-line img{width:40px;height:40px}.supplier-workspace .cart-line>.line-total{grid-column:2}.supplier-workspace .footnote{flex-direction:column;gap:8px}.supplier-workspace .card,.supplier-workspace .order-card{padding:18px}.supplier-workspace .actions>*{flex-grow:1}.supplier-workspace .actions form button{width:100%}.supplier-workspace .money-row{gap:12px}}

.supplier-navigation{display:flex;flex-wrap:wrap;gap:8px 24px;margin-bottom:28px;border-bottom:1px solid var(--line)}
.supplier-navigation a{padding:12px 0;text-decoration:none;font:12px/1.5 monospace;min-height:44px}
.supplier-navigation [aria-current]{border-bottom:2px solid var(--navy);font-weight:700}
.supplier-workspace .panel{margin-bottom:24px;position:relative}
.supplier-workspace .panel::after{content:'+';position:absolute;right:8px;top:4px;color:#799db9;font:16px monospace}
.supplier-workspace table{width:100%;border-collapse:collapse;font-size:.85rem}
.supplier-workspace th{text-align:left;font:10px/1.5 monospace;text-transform:uppercase;letter-spacing:.06em;background:#eef4f9;color:var(--muted)}
.supplier-workspace :is(th,td){padding:16px 12px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.supplier-workspace tbody tr:hover{background:#f1f7fb}
.supplier-workspace .table-scroll{overflow-x:auto;max-width:100%}
.supplier-workspace .table-scroll table{min-width:620px}
.supplier-workspace .panel:has(>form){max-width:740px;margin-inline:auto}
.supplier-workspace .metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:24px 0}
.supplier-workspace .metrics strong{display:block;font-size:2rem;color:var(--navy)}
.supplier-workspace .metrics .card{margin:0}
.supplier-workspace .hero{padding-bottom:28px;align-items:center}
.supplier-workspace .hero .button{margin-bottom:0}
.supplier-workspace form{max-width:100%}
.supplier-workspace :is(button,.button){overflow-wrap:anywhere}
.supplier-workspace td[colspan]{padding-block:30px;color:var(--muted)}
@media(max-width:600px){.supplier-workspace .metrics{grid-template-columns:1fr}.supplier-workspace .panel{padding:18px}.supplier-workspace .hero h1{font-size:2.3rem}.supplier-workspace .hero{padding:22px}.supplier-navigation{gap:4px 18px}.supplier-workspace .panel>div[style*="grid"]{grid-template-columns:minmax(0,1fr)!important}}
</style>
<div class="supplier-workspace">
  {% include 'suppliers/includes/ambient_blueprints.html' %}
  <nav class="supplier-navigation" aria-label="Supplier navigation">
<a href="{% url 'supplier-dashboard' %}" {% if request.resolver_match.url_name == 'supplier-home' or request.resolver_match.url_name == 'supplier-dashboard' %}aria-current="page"{% endif %}>Overview</a>
<a href="{% url 'supplier-products' %}" {% if 'product' in request.resolver_match.url_name %}aria-current="page"{% endif %}>Catalog</a>
<a href="{% url 'supplier-cod-orders' %}" {% if 'cod' in request.resolver_match.url_name %}aria-current="page"{% endif %}>COD fulfillment</a>
<a href="{% url 'supplier-wallet' %}" {% if request.resolver_match.url_name == 'supplier-wallet' %}aria-current="page"{% endif %}>Wallet</a>
</nav>
  <div class="supplier-content">{% block supplier_content %}{% endblock %}</div>
  <footer class="footnote"><span>BUILTASUPPLY / Plan. Source. Build.</span><span>Material pricing · Philippine pesos (PHP)</span></footer>

</div>
{% endblock %}
