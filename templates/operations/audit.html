{% extends 'base.html' %}{% block content %}<section class="panel" style="max-width:100%"><div class="status">AUDIT LOGS</div><h1>Sensitive operations</h1><table><thead><tr><th>Timestamp</th><th>Actor</th><th>Action</th><th>Target</th></tr></thead><tbody>{% for log in logs %}<tr><td>{{ log.created_at }}</td><td>{{ log.actor|default:'System' }}</td><td>{{ log.action }}</td><td>{{ log.target_type }} {{ log.target_id }}</td></tr>{% empty %}<tr><td colspan="4">No audit events.</td></tr>{% endfor %}</tbody></table></section>{% endblock %}
